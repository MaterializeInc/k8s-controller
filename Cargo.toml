[package]
name = "k8s-controller"
version = "0.12.0"
edition = "2024"
rust-version = "1.89.0"

description = "lightweight framework for writing kubernetes controllers"
repository = "https://github.com/MaterializeInc/k8s-controller"
readme = "README.md"
license = "Apache-2.0"
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
# no version feature is enabled here; the final binary crate is responsible
# for enabling one, as described in the k8s-openapi docs
k8s-openapi = { version = "0.27.0", default-features = false }
kube = { version = "3.0.0", default-features = false, features = ["client"] }
kube-runtime = "3.0.0"
rand = "0.10.0"
serde = "1"
serde_json = "1"
thiserror = "2.0.17"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
k8s-openapi = { version = "0.27.0", default-features = false, features = ["v1_34"] }
tokio = "1"

[package.metadata.docs.rs]
features = ["k8s-openapi/latest"]
