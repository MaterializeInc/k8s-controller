[package]
name = "k8s-controller"
version = "0.11.0"
edition = "2024"
rust-version = "1.89.0"

description = "lightweight framework for writing kubernetes controllers"
repository = "https://github.com/MaterializeInc/k8s-controller"
readme = "README.md"
license = "Apache-2.0"
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
json-patch = "4"
kube = { version = "3.0.0", default-features = false, features = ["client", "jsonpatch"] }
kube-runtime = "3.0.0"
rand = "0.9.2"
serde = "1"
thiserror = "2.0.17"
tracing = "0.1"

[dev-dependencies]
k8s-openapi = { version = "0.27.0", default-features = false, features = ["v1_32"] }
kube = { version = "3.0.0", default-features = false, features = ["client", "jsonpatch", "rustls-tls", "aws-lc-rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }

[package.metadata.docs.rs]
features = ["k8s-openapi/latest"]
