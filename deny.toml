[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2

[bans]
multiple-versions = "deny"
skip = [
    # rand 0.10 uses getrandom 0.4 and cpufeatures 0.3. kube still pulls the
    # older versions through ahash and through sha2 in pest's build script.
    { crate = "getrandom@0.3.4", reason = "ahash via kube-runtime and serde-saphyr" },
    { crate = "cpufeatures@0.2.17", reason = "sha2 0.10 via pest_meta in kube-client" },
    # async-trait 0.1.92 uses syn 3. The other proc macros still use syn 2.
    { crate = "syn@2.0.117", reason = "proc macros in kube, futures, serde, thiserror and tracing" },
]

# Use `tracing` instead.
[[bans.deny]]
name = "env_logger"

# We prefer the system's native TLS or OpenSSL to Rustls, since they are more
# mature and more widely used.
[[bans.deny]]
name = "rustls"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
